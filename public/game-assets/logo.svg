<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160" width="380" height="160" fill="none">
  <defs>
    <!-- Water Splash Gradient -->
    <linearGradient id="splashGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3D "Swimming" Letter Gradient -->
    <linearGradient id="swimTextFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e0f2fe" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- 3D Letter Bevel Stroke -->
    <linearGradient id="swimTextStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Wooden Board Gradient -->
    <linearGradient id="woodBoard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="20%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Wood Text Gradient -->
    <linearGradient id="woodTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="logoDeepShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021a36" flood-opacity="0.75" />
    </filter>

    <filter id="woodShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="3.5" flood-color="#021a36" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- ========================================================================= -->
  <!-- 1. WATER SPLASH BACKDROP BEHIND "SWIMMING"                                -->
  <!-- ========================================================================= -->
  <g opacity="0.95">
    <!-- Big splash crown arcs -->
    <path
      d="M60 70 C40 50 35 30 55 18 C70 10 95 35 110 50 C125 25 150 12 175 14 C195 15 210 32 225 48 C240 25 268 12 295 18 C320 25 330 48 315 70 C335 60 355 70 350 88 C345 102 320 100 295 95 C255 100 120 100 80 95 C55 100 30 100 25 85 C20 70 42 65 60 70 Z"
      fill="url(#splashGrad)"
      stroke="#ffffff"
      stroke-width="3"
    />
    <!-- Droplets -->
    <circle cx="45" cy="18" r="5" fill="#e0f2fe" />
    <circle cx="35" cy="32" r="3.5" fill="#bae6fd" />
    <circle cx="140" cy="10" r="4.5" fill="#ffffff" />
    <circle cx="210" cy="8" r="4" fill="#ffffff" />
    <circle cx="270" cy="10" r="4.5" fill="#e0f2fe" />
    <circle cx="335" cy="22" r="5" fill="#bae6fd" />
    <circle cx="350" cy="38" r="3" fill="#ffffff" />
    <circle cx="28" cy="55" r="4" fill="#ffffff" />
    <circle cx="355" cy="62" r="4" fill="#bae6fd" />
  </g>

  <!-- ========================================================================= -->
  <!-- 2. 3D "Swimming" TEXT                                                     -->
  <!-- ========================================================================= -->
  <g filter="url(#logoDeepShadow)">
    <!-- Deep Navy 3D Extrusion Layer (Y+6, Y+5, Y+4, Y+3, Y+2) -->
    <text
      x="190"
      y="76"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="56"
      font-weight="900"
      fill="#031b33"
      stroke="#031b33"
      stroke-width="16"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      Swimming
    </text>
    <text
      x="190"
      y="72"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="56"
      font-weight="900"
      fill="#024478"
      stroke="#024478"
      stroke-width="12"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      Swimming
    </text>
    <!-- White Inner Bevel Outline -->
    <text
      x="190"
      y="68"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="56"
      font-weight="900"
      fill="url(#swimTextFill)"
      stroke="#ffffff"
      stroke-width="6"
      stroke-linejoin="round"
    >
      Swimming
    </text>
    <!-- Front Face Fill -->
    <text
      x="190"
      y="68"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="56"
      font-weight="900"
      fill="url(#swimTextFill)"
    >
      Swimming
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. WOODEN BANNER: "· Dive · Collect · Survive ·"                          -->
  <!-- ========================================================================= -->
  <g filter="url(#woodShadow)">
    <!-- Wooden Plank Outer Shape (Curved Plank) -->
    <path
      d="M52 110 C52 102 60 96 70 96 L310 96 C320 96 328 102 328 110 L324 130 C324 138 316 144 306 144 L74 144 C64 144 56 138 56 130 Z"
      fill="url(#woodBoard)"
      stroke="#451a03"
      stroke-width="4"
    />
    <!-- Wood Highlight Inner Bevel -->
    <path
      d="M68 100 L312 100"
      stroke="#fde68a"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.7"
    />
    <!-- Wood grain notches -->
    <path d="M110 102 Q125 106 140 103" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
    <path d="M230 104 Q250 107 270 103" stroke="#78350f" stroke-width="2" stroke-linecap="round" />

    <!-- Left Metal Screw/Stud -->
    <circle cx="68" cy="120" r="4.5" fill="#451a03" stroke="#fde68a" stroke-width="1.5" />
    <line x1="65" y1="120" x2="71" y2="120" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Metal Screw/Stud -->
    <circle cx="312" cy="120" r="4.5" fill="#451a03" stroke="#fde68a" stroke-width="1.5" />
    <line x1="309" y1="120" x2="315" y2="120" stroke="#fde68a" stroke-width="1.5" stroke-linecap="round" />

    <!-- Banner Text: "· Dive · Collect · Survive ·" -->
    <!-- Text Shadow -->
    <text
      x="190"
      y="126"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="16"
      font-weight="900"
      fill="#451a03"
      stroke="#451a03"
      stroke-width="4"
      stroke-linejoin="round"
      letter-spacing="1"
    >
      · Dive · Collect · Survive ·
    </text>
    <!-- Text Front -->
    <text
      x="190"
      y="125"
      text-anchor="middle"
      font-family="'Fredoka', 'Nunito', 'Arial Rounded MT Bold', sans-serif"
      font-size="16"
      font-weight="900"
      fill="url(#woodTextGrad)"
      letter-spacing="1"
    >
      · Dive · Collect · Survive ·
    </text>
  </g>
</svg>
