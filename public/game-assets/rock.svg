<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <radialGradient id="slateGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="55%" stop-color="#64748b" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </radialGradient>
    <radialGradient id="rockWaterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Water ripple ring -->
  <ellipse cx="50" cy="54" rx="44" ry="16" fill="url(#rockWaterRipple)" />
  <ellipse cx="50" cy="52" rx="38" ry="12" fill="#000000" opacity="0.25" />

  <!-- 3D Smooth Rounded Slate Pool Stone -->
  <path
    d="M 22 48
       C 14 36, 24 20, 44 15
       C 64 10, 82 18, 88 32
       C 94 46, 86 60, 70 65
       C 50 70, 28 62, 22 48 Z"
    fill="url(#slateGrad)"
    stroke="#1e293b"
    stroke-width="2"
  />

  <!-- Glossy Sunlight Highlight on Stone Top -->
  <ellipse cx="42" cy="25" rx="18" ry="7" transform="rotate(-15 42 25)" fill="#ffffff" opacity="0.5" />
  <ellipse cx="38" cy="23" rx="8" ry="3" transform="rotate(-15 38 23)" fill="#ffffff" opacity="0.8" />

  <!-- Subtle Slate Stratum Ridges -->
  <path d="M 30 42 C 45 44, 65 38, 78 44" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none" />
  <path d="M 36 50 C 50 52, 68 47, 74 53" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" opacity="0.4" fill="none" />
</svg>
