<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <radialGradient id="ringShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.5"/>
      <stop offset="100%" stopColor="#0369a1" stopOpacity="0"/>
    </radialGradient>
  </defs>

  <!-- Shadow in water -->
  <ellipse cx="50" cy="56" rx="42" ry="34" fill="url(#ringShadow)"/>

  <!-- Inflatable Swim Ring Outer Circle -->
  <ellipse cx="50" cy="48" rx="40" ry="32" fill="#ef4444" stroke="#991b1b" stroke-width="2.5"/>

  <!-- White Striped Sections -->
  <!-- Top/Right white patch -->
  <path d="M50 16 C68 16 84 22 88 34 L72 38 C70 30 58 26 50 26 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Bottom/Left white patch -->
  <path d="M50 80 C32 80 16 74 12 62 L28 58 C30 66 42 70 50 70 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Inflatable Inner Hole (Water showing through) -->
  <ellipse cx="50" cy="48" rx="18" ry="14" fill="#38bdf8" stroke="#991b1b" stroke-width="2"/>
  <ellipse cx="50" cy="48" rx="15" ry="11" fill="#0284c7" opacity="0.6"/>

  <!-- Plastic Gloss Shine -->
  <path d="M22 34 C26 24 40 20 54 20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75"/>
</svg>

