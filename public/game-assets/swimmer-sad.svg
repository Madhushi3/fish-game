<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140" fill="none">
  <defs>
    <radialGradient id="sadSplash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.8"/>
      <stop offset="60%" stopColor="#38bdf8" stopOpacity="0.4"/>
      <stop offset="100%" stopColor="#0284c7" stopOpacity="0"/>
    </radialGradient>
    <linearGradient id="sadSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fed7aa"/>
      <stop offset="100%" stopColor="#fba362"/>
    </linearGradient>
  </defs>

  <!-- Water ripples and splashes -->
  <ellipse cx="80" cy="115" rx="70" ry="20" fill="url(#sadSplash)"/>
  <path d="M20 115 Q40 100 60 115 Q80 100 100 115 Q120 100 140 115" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="28" cy="98" r="4" fill="#ffffff" opacity="0.8"/>
  <circle cx="132" cy="100" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="50" cy="88" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="110" cy="90" r="3" fill="#ffffff" opacity="0.7"/>

  <!-- Hands clutching water edge / floating -->
  <ellipse cx="38" cy="108" rx="10" ry="7" fill="url(#sadSkin)" stroke="#c2410c" stroke-width="1.5"/>
  <ellipse cx="122" cy="108" rx="10" ry="7" fill="url(#sadSkin)" stroke="#c2410c" stroke-width="1.5"/>

  <!-- Swimmer Head in Water -->
  <ellipse cx="80" cy="72" rx="32" ry="34" fill="url(#sadSkin)" stroke="#c2410c" stroke-width="2"/>

  <!-- Wet Spiky Hair -->
  <path d="M50 65 Q60 30 80 32 Q100 30 110 65 Q96 42 80 44 Q64 42 50 65 Z" fill="#1e293b"/>
  <path d="M72 32 L75 22 L82 30" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M84 32 L90 24 L94 34" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- Drooping Swimming Goggles over Forehead -->
  <ellipse cx="68" cy="54" rx="12" ry="8" transform="rotate(-10 68 54)" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <ellipse cx="92" cy="54" rx="12" ry="8" transform="rotate(10 92 54)" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
  <line x1="78" y1="53" x2="82" y2="53" stroke="#0284c7" stroke-width="3"/>
  <ellipse cx="67" cy="53" rx="4" ry="2" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="91" cy="53" rx="4" ry="2" fill="#ffffff" opacity="0.7"/>

  <!-- Sad Drooping Eyebrows -->
  <path d="M60 70 Q68 64 74 72" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M100 70 Q92 64 86 72" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Closed / Squinting Sad Eyes -->
  <path d="M62 78 Q68 84 74 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M98 78 Q92 84 86 78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Teardrop -->
  <path d="M60 82 Q56 88 60 92 Q64 88 60 82 Z" fill="#38bdf8"/>

  <!-- Sad Pouting Mouth -->
  <path d="M72 98 Q80 90 88 98" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>

